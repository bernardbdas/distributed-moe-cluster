[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-moe-cluster"
version = "1.0.0"
description = "Distributed 3D-Parallel Foundation Model Pre-Training & Alignment Cluster"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bernard B. Das", email = "bernard@example.com" }
]
dependencies = [
    "torch>=2.3.0",
    "deepspeed>=0.14.0; sys_platform == 'linux'",
    "ray[train,tune]>=2.20.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "flash-attn>=2.5.8; sys_platform == 'linux'",
    "triton>=2.3.0; sys_platform == 'linux'",
    "wandb>=0.17.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "pre-commit>=3.8.0",
]

[project.scripts]
moe-cluster = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
