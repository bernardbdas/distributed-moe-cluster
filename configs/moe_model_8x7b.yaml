model:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 14336
  num_hidden_layers: 32
  num_attention_heads: 32
  num_key_value_heads: 8  # Grouped Query Attention (GQA)
  max_position_embeddings: 8192
  rms_norm_eps: 1.0e-5
  rope_theta: 500000.0

moe:
  num_experts: 8
  num_experts_per_tok: 2  # Top-2 routing
  aux_loss_coef: 0.01     # Load balancing coefficient
  router_z_loss_coef: 0.001
  capacity_factor: 1.25

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 100000
  precision: "bf16"
  gradient_clipping: 1.0
  seed: 42
